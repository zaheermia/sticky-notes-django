{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Edit note{% else %}New note{% endif %}{% endblock %}

{% block content %}
    <h2>{% if form.instance.pk %}Edit note{% else %}New note{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Save</button>
        <a href="{% url 'note_list' %}">Cancel</a>
    </form>
{% endblock %}
