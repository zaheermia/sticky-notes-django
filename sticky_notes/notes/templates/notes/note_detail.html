{% extends 'base.html' %}

{% block title %}{{ note.title }}{% endblock %}

{% block content %}
    <div class="note note-large">
        <h2>{{ note.title }}</h2>
        <p>{{ note.content|linebreaksbr }}</p>
        <small>Created {{ note.created_at|date:"d M Y, H:i" }}</small>
    </div>
    <p class="actions">
        <a class="button" href="{% url 'note_update' pk=note.pk %}">Edit</a>
        <a class="button danger" href="{% url 'note_delete' pk=note.pk %}">Delete</a>
        <a href="{% url 'note_list' %}">Back to all notes</a>
    </p>
{% endblock %}
